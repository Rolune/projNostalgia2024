<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<!-- main css -->
	<link rel="stylesheet" href="resource/css/main.css">
</head>

<body>
	<header>
		<nav id="nav-main" class="bg-stripe border-shadow">
			<div id="nav-main-upper" class="flex-between">
				<div id="logo" class="logo-sml-0">
					<!-- tmp colour picked on blender -->
				</div>
				<!-- extra links -->
				<div id="nav-extra-upper">
					<!-- should be changed to a tag later -->
					<p>contact</p>
					<p>credit</p>
				</div>
			</div>
			<div id="nav-main-bar"></div>
		</nav>
		<div id="header-free">free area 🐛
			<div class="test-colPal">
				<div class="test-col-2"></div>
				<div class="test-col-0"></div>
				<div class="test-col-1"></div>
			</div>
		</div>
		<!-- "login" window -->
		<section id="login-sect" class="bShadow" style="
		background-color: white;
		">
			<div id="login-area" class="bg-stripe" style="
			padding: 5px;
			display: grid; gap: 5px;
			grid-template-rows: 2.5em auto 3em;">
				<div style="
				display: flex;
				background-color: darkblue;">
					<div class="capsule-thin" style="
					background-color: lightblue;"></div>
					<h4 style="
					margin: auto 0;
					color: white;">Login Area</h4>
				</div>
				<!-- would be form later -->
				<div style="background-color: hsl(0, 0%, 80%);"></div>
				<div style="
				padding: 5px;
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 5px;
				background-color: darkblue;">
					<div style="background-color: lightblue;">btn 1 area</div>
					<div style="background-color: lightblue;">btn 2 area</div>
				</div>
			</div>
			<div id="startButton" style="
			background-color: gray;"></div>
		</section>
	</header>
	<main style="
	background: hsl(0 0 100);
	border-radius: 20px;
	display: grid;
	grid-template-columns: 1fr 3px auto;">
		<!-- this might work better as a grid -->
		<section id="sect-main" class="gray1" style="
		display: flex;
		flex-wrap: wrap;
		margin: 20px 5px 5px 5px;">
			<div class="contentList" style="
			background: lightcoral;">panel 1</div>
			<div class="contentList" style="
			background: orange;">panel 2</div>
			<div id="scrollingContent" style="
			width: 100%;
			min-width: 500px;
			height: 200px;
			background: yellow;">Scrolling Stuff</div>
			<div class="contentList" style="
			background: lightcyan;">panel 3</div>
			<div class="contentList" style="
			background: lightcoral;">panel 4</div>
			<div style="
			width: 100%;
			height: 1000px;
			text-align: center;">Area left to increase scroll size</div>
		</section>
		<div id="dividingLine" style="
		background: lightblue;
		width: 100%;"></div>
		<nav id="nav-side" class="gray0" style="margin: 20px 5px;">
			<div style="
			position:sticky;
			top: calc(50% - 250px);
			height: 500px;
			width: 200px;
			max-width: 300px;
			background: red;">
				<h3>Side Bar</h3>
				<p>this area should follow until it hits it's edge & stay</p>
			</div>
		</nav>
	</main>
	<footer style="height: 200px;"></footer>
</body>

</html>
